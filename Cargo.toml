[package]
name = "rsgewatch"
version = "0.1.0"
edition = "2021"
authors = ["Ken Tankrus"]
description = "RuneScape 3 Grand Exchange investment tracker with Telegram alerts."
license = "MIT"

[[bin]]
name = "rsgewatch"
path = "src/main.rs"

[dependencies]
# GUI
eframe = "0.29"
egui = "0.29"

# System tray (Windows: creates its own hidden window + message loop)
tray-icon = "0.19"

# Direct WinAPI access for showing/hiding the main window from tray
# callbacks -- see app::tray module docs for why this bypasses egui.
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"

# Autostart with Windows
auto-launch = "0.5"

# Async runtime + HTTP client (GE price fetch, Telegram API)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
async-trait = "0.1"

# Serialization / storage
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"

# Dates
chrono = { version = "0.4", features = ["serde"] }

# IDs
uuid = { version = "1", features = ["v4"] }

# Errors / logging
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
strip = true
